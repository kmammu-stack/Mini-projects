<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple To-Do App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; background: #eee; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { color: red; text-decoration: none; font-weight: bold; }
        input[type="text"] { width: 70%; padding: 8px; }
        button { padding: 8px 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My To-Do List</h2>
        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="Enter a new task..." required>
            <button type="submit">Add Task</button>
        </form>
        <ul>
            {% for todo in todos %}
                <li>
                    {{ todo }} 
                    <a href="/delete/{{ loop.index0 }}" class="delete-btn">X</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
